# dnsmasq on the Mac mini: the apartment's DHCP server AND its DNS resolver.
# Source of truth is this file in Project-Harah (skill/network/dnsmasq.conf),
# installed to /opt/homebrew/etc/dnsmasq.conf. Runs as root via
# `sudo brew services start dnsmasq` (DHCP needs the BPF socket).
# Decision: Alex, 2026-11-12 ("I want DHCP on the mini ... the router relies on
# the mini instead of assigning it per device"). Rollback: stop this service,
# turn the BGW320's DHCP back on (gateway.py dhcp on).
#
# DNS (2026-11-26): dnsmasq resolves for the LAN itself, caching, forwarding to
# the gateway and Cloudflare. The Pi-hole that used to sit behind it was removed
# at Alex's word; the local records it held for the hosted names live here now.

port=53
listen-address=127.0.0.1    # the mini's own processes may ask here too
interface=en0               # the mini's wired LAN port
bind-interfaces
no-ping                     # the mini runs no competing server once the gateway's DHCP is off
dhcp-authoritative          # answer every client on this LAN promptly, including stale leases
dhcp-rapid-commit
dhcp-leasefile=/opt/homebrew/var/lib/misc/dnsmasq/dnsmasq.leases
log-dhcp
log-facility=/opt/homebrew/var/log/dnsmasq-dhcp.log

# DNS: forward to the gateway (keeps attlocal.net upstream behaviour) and
# Cloudflare, cache locally.
no-resolv
server=192.168.1.254
server=1.1.1.1
cache-size=1000
domain-needed
bogus-priv
# Names and PTRs for this LAN are answered here from the DHCP leases and never
# forwarded; unknown ones get NXDOMAIN.
domain=attlocal.net
local=/attlocal.net/
local=/1.168.192.in-addr.arpa/

# Split horizon: the hosted names resolve to the mini inside the house, because
# the BGW320 does not hairpin its public address. Same set the Pi-hole carried
# (2026-11-23), exact names only; keep this list equal to the site blocks in ~/caddyfile.
host-record=relay.hivedeck.app,192.168.1.200
host-record=relay-b.hivedeck.app,192.168.1.200
host-record=notes.hannahporras.app,192.168.1.200
host-record=lxrbckl.com,192.168.1.200
host-record=vaultwarden.lxrbckl.com,192.168.1.200
host-record=immich.lxrbckl.com,192.168.1.200
host-record=resume.lxrbckl.com,192.168.1.200
host-record=ds.lxrbckl.com,192.168.1.200
host-record=lucidindex.lxrbckl.com,192.168.1.200
host-record=sawyer.showalter.business,192.168.1.200

# Same pool and lease the BGW320 used (.64–.253, 1 day), so nothing moves.
dhcp-range=192.168.1.64,192.168.1.253,255.255.255.0,24h
dhcp-option=option:router,192.168.1.254          # the gateway stays the gateway
dhcp-option=option:dns-server,192.168.1.200      # this dnsmasq, and only it
dhcp-option=option:domain-name,attlocal.net
dhcp-option=option:domain-search,attlocal.net
dhcp-option=option:ntp-server,192.168.1.254

# Fixed allocations carried over from the gateway's ipalloc.ha (2026-11-12).
# The mini itself is on a manual IP (networksetup) and does not ask; this line
# only keeps .200 out of the pool for everyone else.
dhcp-host=d0:11:e5:26:e2:a4,192.168.1.200,Alexs-Mac-mini
dhcp-host=6a:30:71:a9:89:9d,192.168.1.201,MacBook-Pro      # private Wi-Fi address for this network
dhcp-host=1c:db:d4:44:96:88,192.168.1.210,P1S-379
dhcp-host=e8:f6:0a:95:1c:ec,192.168.1.211,P1S-130
# Raspberry Pi block starts at .220 (Alex, 2026-11-25: two Pi Zero W boards,
# Raspberry Pi OS Lite, keyed to each board's own Wi-Fi address).
dhcp-host=b8:27:eb:06:75:fa,192.168.1.220,pi-zero-1
dhcp-host=b8:27:eb:c5:f8:b6,192.168.1.221,pi-zero-2
