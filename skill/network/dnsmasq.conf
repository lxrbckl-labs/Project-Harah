# dnsmasq on the Mac mini: a TEMPORARY, DNS-only transition config.
# Source of truth is this file in Project-Harah; it is installed to
# /opt/homebrew/etc/dnsmasq.conf by step 1 of the Pi-hole removal
# (Alex, 2026-11-14), which also hands DHCP back to the AT&T gateway.
#
# Why it exists: devices that still hold an old lease name 192.168.1.200 as
# their DNS server. This keeps them resolving (gateway 192.168.1.254 first,
# then 1.1.1.1) until the last of those leases expires (2026-11-15 23:01).
# It also answers the two names the HiveDeck relays use, which live on the mini.
#
# It serves no DHCP. This file and the dnsmasq daemon go away at step 2, on or
# after 2026-11-16 (`sudo brew services stop dnsmasq`); see network/README.md.

port=53
listen-address=127.0.0.1
interface=en0
bind-interfaces
no-resolv
strict-order
server=192.168.1.254
server=1.1.1.1
domain-needed
cache-size=1000
host-record=relay.hivedeck.app,192.168.1.200
host-record=relay-b.hivedeck.app,192.168.1.200
