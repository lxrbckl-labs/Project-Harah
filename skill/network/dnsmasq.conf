# dnsmasq on the Mac mini: the apartment's DHCP server AND its DNS front door.
# Source of truth is this file in Project-Harah, installed to
# /opt/homebrew/etc/dnsmasq.conf by dhcp-takeover.sh. Runs as root via
# `sudo brew services start dnsmasq` (DHCP needs the BPF socket).
# Decision: Alex, 2026-11-12 ("I want DHCP on the mini ... the router relies on
# the mini instead of assigning it per device"). Rollback: stop this service,
# turn the BGW320's DHCP back on (gateway.py dhcp on).
#
# DNS (2026-11-12, per-client visibility): Docker Desktop NATs every LAN client
# to one address, so the Pi-hole container cannot see who asked. dnsmasq owns
# :53 on the LAN instead, forwards every query to the Pi-hole on 127.0.0.1:5335
# and stamps the real client address on it as EDNS0 Client Subnet (add-subnet);
# Pi-hole FTL (dns.EDNS0ECS=true) logs that address as the client.

port=53
listen-address=127.0.0.1    # the Pi-hole's reverse lookups come back to us here
interface=en0               # the mini's wired LAN port
bind-interfaces
no-ping                     # the mini runs no competing server once the gateway's DHCP is off
dhcp-authoritative          # answer every client on this LAN promptly, including stale leases
dhcp-rapid-commit
dhcp-leasefile=/opt/homebrew/var/lib/misc/dnsmasq/dnsmasq.leases
log-dhcp
log-facility=/opt/homebrew/var/log/dnsmasq-dhcp.log

# DNS: forward everything to the Pi-hole, uncached, tagged with the client.
no-resolv
server=127.0.0.1#5335
add-subnet=32,128           # full IPv4 / IPv6 client address as ECS
cache-size=0                # the Pi-hole sees and counts every query
domain-needed
bogus-priv
# Names and PTRs for this LAN are answered here from the DHCP leases and never
# forwarded. The Pi-hole's conditional forwarding (revServers) points back at
# 192.168.1.200 for exactly these, so the local= lines are what keep that from
# looping: unknown ones get NXDOMAIN, not another trip to the Pi-hole.
domain=attlocal.net
local=/attlocal.net/
local=/1.168.192.in-addr.arpa/

# Same pool and lease the BGW320 used (.64–.253, 1 day), so nothing moves.
dhcp-range=192.168.1.64,192.168.1.253,255.255.255.0,24h
dhcp-option=option:router,192.168.1.254          # the gateway stays the gateway
dhcp-option=option:dns-server,192.168.1.200      # the Pi-hole, and only the Pi-hole
dhcp-option=option:domain-name,attlocal.net
dhcp-option=option:domain-search,attlocal.net
dhcp-option=option:ntp-server,192.168.1.254

# Fixed allocations carried over from the gateway's ipalloc.ha (2026-11-12).
# The mini itself is on a manual IP (networksetup) and does not ask; this line
# only keeps .200 out of the pool for everyone else.
dhcp-host=d0:11:e5:26:e2:a4,192.168.1.200,Alexs-Mac-mini
dhcp-host=6a:30:71:a9:89:9d,192.168.1.201,MacBook-Pro      # private Wi-Fi address for this network
dhcp-host=1c:db:d4:44:96:88,192.168.1.210,P1S-379
dhcp-host=e8:f6:0a:95:1c:ec,192.168.1.211,P1S-130
